version: '3.8'

services:
  backend:
    build: ./backend
    container_name: django_backend
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - static_volume:/app/staticfiles

  nginx:
    image: nginx:alpine
    container_name: nginx_server
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/build:/var/www/ecommerce/frontend/build:ro
      - static_volume:/var/www/ecommerce/backend/staticfiles:ro
      - ./backend/static/images:/var/www/ecommerce/backend/static/images:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend

volumes:
  static_volume:
